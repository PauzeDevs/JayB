<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 878 722" role="img" aria-labelledby="title desc">
<title id="title">Talk artwork</title><desc id="desc">Burnt sienna and dark blue-brown artwork with concentric rings and TALK lettering.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#b97852"/><stop offset=".48" stop-color="#8c533b"/><stop offset="1" stop-color="#243a4a"/></linearGradient>
 <radialGradient id="glow" cx="55%" cy="48%" r="72%"><stop offset="0" stop-color="#c07b50" stop-opacity=".9"/><stop offset="1" stop-color="#251b1a" stop-opacity=".45"/></radialGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="4" dy="5" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="878" height="722" fill="url(#bg)"/><rect width="878" height="722" fill="url(#glow)"/>
<g fill="none" stroke="#e8d1ad" stroke-opacity=".72" stroke-width="2"><circle cx="439" cy="361" r="247"/><circle cx="439" cy="361" r="168"/></g>
<text x="439" y="382" fill="#fff0d7" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="51" letter-spacing="-2" text-anchor="middle" filter="url(#shadow)">TALK.</text>
<rect width="878" height="722" filter="url(#grain)" opacity=".55"/>
</svg>