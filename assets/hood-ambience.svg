<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 878 721" role="img" aria-labelledby="title desc">
<title id="title">Hood Ambience artwork</title><desc id="desc">Warm burnt-orange and deep-brown artwork with concentric rings and JB times NS lettering.</desc>
<defs>
 <radialGradient id="bg" cx="50%" cy="48%" r="74%"><stop offset="0" stop-color="#b8753e"/><stop offset=".43" stop-color="#8c482c"/><stop offset="1" stop-color="#351914"/></radialGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="4" dy="5" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="878" height="721" fill="url(#bg)"/>
<g fill="none" stroke="#e8d1ad" stroke-opacity=".72" stroke-width="2"><circle cx="439" cy="360.5" r="247"/><circle cx="439" cy="360.5" r="168"/></g>
<g fill="#fff0d7" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle" filter="url(#shadow)"><text x="439" y="350" font-size="49" letter-spacing="-3">JB</text><text x="439" y="408" font-size="49" letter-spacing="-3">× NS</text></g>
<rect width="878" height="721" filter="url(#grain)" opacity=".55"/>
</svg>